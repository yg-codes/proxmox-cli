name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { echo 'Unformatted files:'; gofmt -l .; exit 1; }

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build
