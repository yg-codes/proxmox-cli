version: 2

project_name: proxmox-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: pve
    main: ./pve
    binary: pve
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version=v{{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party_licenses/*

# Native packages for on-node install (e.g. dpkg -i on a Proxmox host).
# Linux-only — nfpm does not build darwin/windows packages.
nfpms:
  - id: pve
    package_name: pve
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    maintainer: yg <30710202+yg-codes@users.noreply.github.com>
    description: Proxmox VE administration CLI (single static binary)
    license: MIT
    homepage: https://github.com/yg-codes/proxmox-cli
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/pve/README.md
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/pve/LICENSE
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/pve/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644
      - src: ./third_party_licenses
        dst: /usr/share/doc/pve/third_party_licenses
        type: tree
        file_info:
          mode: 0644

checksum:
  name_template: checksums.sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  replace_existing_draft: true
  header: |
    ## pve {{.Tag}}

    Proxmox VE administration CLI with AWS-style command interface.
  footer: |
    **Full changelog**: https://github.com/yg-codes/proxmox-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

